<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EasyLink</title>
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var redirect = '/?p=' + encodeURIComponent(path.replace(/&/g, '~and~'));
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
